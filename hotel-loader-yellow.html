होत","प्रत्येक दिवसाचा प्रवास सजवत आहोत","काही क्षणांतच तुमची सहल तयार"],["તમારા માટે શ્રેષ્ઠ પ્રવાસ યોજના બનાવી રહ્યા છીએ","તમારા માટે સરસ હોટેલ પસંદ કરી રહ્યા છીએ","ફરવા લાયક ખાસ સ્થળો ઉમેરી રહ્યા છીએ","દરેક દિવસની સફર સજાવી રહ્યા છીએ","થોડી જ ક્ષણોમાં તમારી સફર તૈયાર"],["ನಿಮಗಾಗಿ ಅತ್ಯುತ್ತಮ ಪ್ರವಾಸ ಯೋಜನೆ ರೂಪಿಸುತ್ತಿದ್ದೇವೆ","ನಿಮಗಾಗಿ ಉತ್ತಮ ಹೋಟೆಲ್‌ಗಳನ್ನು ಆರಿಸುತ್ತಿದ್ದೇವೆ","ನೋಡಲೇಬೇಕಾದ ಸ್ಥಳಗಳನ್ನು ಸೇರಿಸುತ್ತಿದ್ದೇವೆ","ಪ್ರತಿ ದಿನದ ಪ್ರಯಾಣವನ್ನು ಸುಂದರಗೊಳಿಸುತ್ತಿದ್ದೇವೆ","ಇನ್ನು ಕೆಲವೇ ಕ್ಷಣಗಳಲ್ಲಿ ನಿಮ್ಮ ಪ್ರವಾಸ ಸಿದ್ಧ"],["നിങ്ങൾക്കായി മികച്ച യാത്രാപദ്ധതി ഒരുക്കുന്നു","മികച്ച ഹോട്ടലുകൾ തിരഞ്ഞെടുക്കുന്നു","കാണേണ്ട സ്ഥലങ്ങൾ ചേർക്കുന്നു","ഓരോ ദിവസത്തെയും യാത്ര മനോഹരമാക്കുന്നു","ഏതാനും നിമിഷങ്ങൾക്കുള്ളിൽ നിങ്ങളുടെ യാത്ര തയ്യാർ"],["ਤੁਹਾਡੇ ਲਈ ਵਧੀਆ ਯਾਤਰਾ ਯੋਜਨਾ ਬਣਾ ਰਹੇ ਹਾਂ","ਤੁਹਾਡੇ ਲਈ ਵਧੀਆ ਹੋਟਲ ਚੁਣ ਰਹੇ ਹਾਂ","ਘੁੰਮਣ ਵਾਲੀਆਂ ਖਾਸ ਥਾਵਾਂ ਜੋੜ ਰਹੇ ਹਾਂ","ਹਰ ਦਿਨ ਦਾ ਸਫ਼ਰ ਸਜਾ ਰਹੇ ਹਾਂ","ਕੁਝ ਪਲਾਂ ਵਿੱਚ ਤੁਹਾਡੀ ਯਾਤਰਾ ਤਿਆਰ"],["ଆପଣଙ୍କ ପାଇଁ ସର୍ବୋତ୍ତମ ଭ୍ରମଣ ଯୋଜନା ପ୍ରସ୍ତୁତ କରୁଛୁ","ଆପଣଙ୍କ ପାଇଁ ଭଲ ହୋଟେଲ ବାଛୁଛୁ","ଦେଖିବା ଯୋଗ୍ୟ ସ୍ଥାନ ଯୋଡୁଛୁ","ପ୍ରତ୍ୟେକ ଦିନର ଯାତ୍ରା ସଜାଉଛୁ","କିଛି କ୍ଷଣରେ ଆପଣଙ୍କ ଯାତ୍ରା ପ୍ରସ୍ତୁତ"]],M=[];for(let j=0;j<5;j++)L.forEach(l=>M.push(l[j]));const $=id=>document.getElementById(id),o=$("ov"),c=$("cl");c.innerHTML=M.map(t=>"<div>"+t+"</div>").join("");const R=[...c.children];let i=0,t;const S=()=>{R.forEach((e,k)=>e.className=k==i?"a":"");c.style.transform="translateY("+(36-36*i)+"px)"};window.Loader={show(){clearInterval(t);i=0;S();o.classList.add("on");requestAnimationFrame(()=>o.classList.add("show"));t=setInterval(()=>{i=(i+1)%M.length;S()},1200)},hide(){clearInterval(t);o.classList.remove("show");setTimeout(()=>o.classList.remove("on"),300)}};$("go").onclick=async()=>{Loader.show();try{/* replace with your DB call: await fetch('/api/hotels').then(r=>r.json()) */await new Promise(r=>setTimeout(r,8000))}finally{Loader.hide()}}})()</script></body></html>
